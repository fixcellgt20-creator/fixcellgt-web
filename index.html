<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixCellGt - Buscador de Inventario</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-section {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-input {
            position: relative;
        }

        .search-input label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .search-input input,
        .search-input select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .search-input input:focus,
        .search-input select:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-search {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-clear {
            background: #e9ecef;
            color: #333;
        }

        .btn-clear:hover {
            background: #dee2e6;
        }

        .btn-export {
            background: #28a745;
            color: white;
        }

        .btn-export:hover {
            background: #218838;
        }

        .results-section {
            padding: 30px;
        }

        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .results-count {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        table td {
            padding: 12px 15px;
            border-bottom: 1px solid #dee2e6;
        }

        table tbody tr:hover {
            background: #f8f9fa;
        }

        table tbody tr:nth-child(even) {
            background: #f8f9fa;
        }

        .price-cell {
            font-weight: 600;
            color: #28a745;
        }

        .margin-cell {
            font-weight: 600;
            color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            text-align: center;
            padding: 40px;
            font-size: 1.1em;
            color: #666;
        }

        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .search-grid {
                grid-template-columns: 1fr;
            }

            .search-buttons {
                flex-direction: column;
            }

            .results-info {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }

            table {
                font-size: 0.9em;
            }

            table th, table td {
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>🔧 FixCellGt Inventario</h1>
            <p>Buscador de repuestos y precios</p>
        </div>

        <!-- BÚSQUEDA -->
        <div class="search-section">
            <div class="search-grid">
                <div class="search-input">
                    <label for="marca">Marca</label>
                    <select id="marca">
                        <option value="">-- Todas --</option>
                    </select>
                </div>

                <div class="search-input">
                    <label for="modelo">Modelo</label>
                    <input type="text" id="modelo" placeholder="Ej: iPhone 12, Galaxy S21...">
                </div>

                <div class="search-input">
                    <label for="repuesto">Tipo de Repuesto</label>
                    <select id="repuesto">
                        <option value="">-- Todos --</option>
                    </select>
                </div>

                <div class="search-input">
                    <label for="calidad">Calidad</label>
                    <select id="calidad">
                        <option value="">-- Todas --</option>
                    </select>
                </div>

                <div class="search-input">
                    <label for="precioMin">Precio Mín. (Q)</label>
                    <input type="number" id="precioMin" placeholder="0">
                </div>

                <div class="search-input">
                    <label for="precioMax">Precio Máx. (Q)</label>
                    <input type="number" id="precioMax" placeholder="10000">
                </div>
            </div>

            <div class="search-buttons">
                <button class="btn-search" onclick="buscar()">🔍 Buscar</button>
                <button class="btn-clear" onclick="limpiar()">🔄 Limpiar</button>
                <button class="btn-export" onclick="exportarCSV()">📥 Exportar CSV</button>
            </div>
        </div>

        <!-- RESULTADOS -->
        <div class="results-section">
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Cargando datos...</p>
            </div>

            <div id="message" class="message" style="display: none;">
                Usa los filtros de arriba para buscar repuestos
            </div>

            <div id="resultsContainer"></div>
        </div>
    </div>

    <script>
        // URL de la API (CAMBIA ESTO A TU SERVIDOR)
        const API_URL = 'https://hindu-manufacturers-poker-procedures.trycloudflare.com/api';

        // Variables globales
        let datosGlobales = [];

        // Cargar opciones de filtros al inicio
        async function cargarFiltros() {
            try {
                // Cargar marcas
                const marcasResp = await fetch(`${API_URL}/marcas`);
                const marcas = await marcasResp.json();
                const selectMarcas = document.getElementById('marca');
                marcas.forEach(m => {
                    const option = document.createElement('option');
                    option.value = m;
                    option.textContent = m;
                    selectMarcas.appendChild(option);
                });

                // Cargar repuestos
                const repuestosResp = await fetch(`${API_URL}/repuestos`);
                const repuestos = await repuestosResp.json();
                const selectRepuestos = document.getElementById('repuesto');
                repuestos.forEach(r => {
                    const option = document.createElement('option');
                    option.value = r;
                    option.textContent = r;
                    selectRepuestos.appendChild(option);
                });

                // Cargar calidades
                const calidadesResp = await fetch(`${API_URL}/calidades`);
                const calidades = await calidadesResp.json();
                const selectCalidades = document.getElementById('calidad');
                calidades.forEach(c => {
                    const option = document.createElement('option');
                    option.value = c;
                    option.textContent = c;
                    selectCalidades.appendChild(option);
                });
            } catch (error) {
                console.error('Error cargando filtros:', error);
            }
        }

        // Buscar
        async function buscar() {
            const marca = document.getElementById('marca').value;
            const modelo = document.getElementById('modelo').value;
            const repuesto = document.getElementById('repuesto').value;
            const calidad = document.getElementById('calidad').value;
            const precioMin = document.getElementById('precioMin').value;
            const precioMax = document.getElementById('precioMax').value;

            mostrarLoading();

            try {
                const params = new URLSearchParams();
                if (marca) params.append('marca', marca);
                if (modelo) params.append('modelo', modelo);
                if (repuesto) params.append('repuesto', repuesto);
                if (calidad) params.append('calidad', calidad);
                if (precioMin) params.append('precio_min', precioMin);
                if (precioMax) params.append('precio_max', precioMax);

                const response = await fetch(`${API_URL}/inventario/buscar?${params}`);
                datosGlobales = await response.json();

                mostrarResultados(datosGlobales);
            } catch (error) {
                mostrarError('Error en la búsqueda: ' + error.message);
            }
        }

        // Mostrar resultados
        function mostrarResultados(datos) {
            const container = document.getElementById('resultsContainer');
            const loading = document.getElementById('loading');
            const message = document.getElementById('message');

            loading.style.display = 'none';
            message.style.display = 'none';

            if (datos.length === 0) {
                container.innerHTML = '<div class="message">No se encontraron resultados</div>';
                return;
            }

            let html = `
                <div class="results-info">
                    <span class="results-count">📊 ${datos.length} resultado(s) encontrado(s)</span>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Marca</th>
                                <th>Modelo</th>
                                <th>Repuesto</th>
                                <th>Calidad</th>
                                <th>Color</th>
                                <th>Precio Mayorista</th>
                                <th>Precio Reparación</th>
                                <th>Margen</th>
                                <th>Cantidad</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            datos.forEach(item => {
                html += `
                    <tr>
                        <td>${item.marca}</td>
                        <td>${item.modelo}</td>
                        <td>${item.repuesto}</td>
                        <td>${item.calidad}</td>
                        <td>${item.color}</td>
                        <td class="price-cell">Q${parseFloat(item.precio_base).toFixed(2)}</td>
                        <td class="price-cell">Q${parseFloat(item.precio_reparacion).toFixed(2)}</td>
                        <td class="margin-cell">Q${parseFloat(item.margen).toFixed(2)}</td>
                        <td>${item.cantidad}</td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;
        }

        // Limpiar formulario
        function limpiar() {
            document.getElementById('marca').value = '';
            document.getElementById('modelo').value = '';
            document.getElementById('repuesto').value = '';
            document.getElementById('calidad').value = '';
            document.getElementById('precioMin').value = '';
            document.getElementById('precioMax').value = '';
            datosGlobales = [];
            document.getElementById('resultsContainer').innerHTML = '';
            document.getElementById('message').style.display = 'block';
        }

        // Exportar a CSV
        function exportarCSV() {
            if (datosGlobales.length === 0) {
                alert('No hay datos para exportar');
                return;
            }

            let csv = 'Marca,Modelo,Repuesto,Calidad,Color,Precio Mayorista,Precio Reparación,Margen,Cantidad\n';

            datosGlobales.forEach(item => {
                csv += `"${item.marca}","${item.modelo}","${item.repuesto}","${item.calidad}","${item.color}",${item.precio_base},${item.precio_reparacion},${item.margen},${item.cantidad}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `inventario_${new Date().getTime()}.csv`;
            a.click();
        }

        // Mostrar/ocultar loading
        function mostrarLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultsContainer').innerHTML = '';
            document.getElementById('message').style.display = 'none';
        }

        // Mostrar error
        function mostrarError(mensaje) {
            const container = document.getElementById('resultsContainer');
            const loading = document.getElementById('loading');
            loading.style.display = 'none';
            container.innerHTML = `<div class="error">${mensaje}</div>`;
        }

        // Cargar filtros al cargar la página
        window.addEventListener('load', cargarFiltros);
    </script>
</body>
</html>
